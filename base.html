<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart <span>AI</span>
    </a>

    <nav>

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

            <a href="/logout">
                Logout
            </a>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="nav-cta"
                href="/register"
            >
                Get Started
            </a>

        {% endif %}

    </nav>

</header>


<main>

{% block content %}

{% endblock %}

</main>


<footer>

    <div>

        <strong>
            PocketSmart AI
        </strong>

        <p>
            Plan smarter. Spend intentionally.
        </p>

    </div>

    <div>

        <a href="/testimonials">
            Testimonials
        </a>

        <a href="/history">
            History
        </a>

    </div>

</footer>


<script src="/static/js/app.js"></script>

{% block scripts %}

{% endblock %}

</body>

</html>
